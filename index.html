<title>Midterm 2 Practice Set</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap">
<style>
/* Layout: single-column worksheet. Sections group topics, each question is a block with drawn structures and tappable choices. */
:root {
  --bg: #fbfbf9;
  --ink: #1c2530;
  --muted: #5d6877;
  --rule: #d9dde3;
  --accent: #2456c4;
  --tint: #eaf1fb;
  --good: #1d7a46;
  --good-bg: #e3f3e9;
  --bad: #b3322b;
  --bad-bg: #fbe8e6;
  --font-body: "Albert Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171e; --ink: #e6eaf0; --muted: #97a2b1; --rule: #2a323d; --accent: #7fa6f5; --tint: #182437;
    --good: #6fcf97; --good-bg: #16301f; --bad: #f08a82; --bad-bg: #3a1c1a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171e; --ink: #e6eaf0; --muted: #97a2b1; --rule: #2a323d; --accent: #7fa6f5; --tint: #182437;
  --good: #6fcf97; --good-bg: #16301f; --bad: #f08a82; --bad-bg: #3a1c1a; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 36px; }
.top { border-bottom: 2px solid var(--ink); padding-bottom: 14px; display: flex; flex-direction: column; gap: 12px; }
h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 700; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.meter { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.bar { flex: 1 1 160px; height: 8px; border-radius: 4px; background: var(--rule); overflow: hidden; min-width: 0; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.score { font-family: var(--font-mono); font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.score b { color: var(--ink); font-weight: 500; }
.reset { font: inherit; font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); background: transparent; border: 1.5px solid var(--accent); border-radius: 999px; padding: 5px 14px; min-height: 34px; cursor: pointer; }
.reset:hover { background: var(--tint); }
.reset:focus-visible, .opt:focus-visible, .theme-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

h2.sec { font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin: 0; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.q { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.qh { display: flex; gap: 8px; align-items: baseline; }
.n { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; flex: none; }
.qtext { margin: 0; font-weight: 600; font-size: 1.05rem; max-width: 64ch; text-wrap: pretty; }
.sub { font-weight: 400; color: var(--muted); }

svg.struct { display: block; max-width: 100%; height: auto; overflow: visible; color: var(--ink); }
svg.struct line { stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; }
svg.struct text { fill: currentColor; font-family: var(--font-body); font-size: 14px; font-weight: 500; }
svg.struct .ch { fill: none; stroke: currentColor; stroke-width: 1.2; }

.eq { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; }
.eq .sym { font-size: 1.3rem; color: var(--muted); }
.arrow { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.arrow .rg { font-family: var(--font-mono); font-size: 0.78rem; line-height: 1.1; white-space: nowrap; }
.arrow svg { display: block; }
.arrow path { stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }

.opts { display: flex; flex-direction: column; gap: 8px; }
.opts.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.opts.row { flex-direction: row; flex-wrap: wrap; }
.opt { font: inherit; color: inherit; text-align: left; cursor: pointer; background: transparent; border: 1.5px solid var(--rule); border-radius: 8px; padding: 9px 12px; display: flex; gap: 10px; align-items: center; min-width: 0; }
.opts.grid .opt { flex-direction: column; align-items: stretch; justify-content: space-between; gap: 6px; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--tint); }
.opt .let { font-family: var(--font-mono); font-weight: 500; color: var(--accent); flex: none; min-width: 1.5em; }
.opt .body { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.opts:not(.grid) .opt .body { align-items: flex-start; }
.opts.row .opt { padding: 6px 12px; font-size: 0.92rem; }
.opt .cap { font-size: 0.9rem; color: var(--muted); text-align: center; }
.opt.good { border-color: var(--good); background: var(--good-bg); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); opacity: 0.75; }
.opt:disabled { cursor: default; color: inherit; }
.fb { margin: 0; font-size: 0.92rem; min-height: 1.3em; max-width: 64ch; }
.fb.good { color: var(--good); }
.fb.bad { color: var(--bad); }

.opts.cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.opts.grid.rx { grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
.opts.rx .opt { flex-direction: row; align-items: center; }
.opts.grid .opt { justify-content: flex-start; }
.rxo { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; min-width: 0; }
.rxo .arrow { flex: none; align-items: center; max-width: 150px; }
.rxo .arrow .rg { white-space: normal; text-align: center; font-size: 0.74rem; }
.rgs { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.rgs .rg { font-family: var(--font-mono); font-size: 0.8rem; }
.opts.grid .opt .body { align-items: flex-start; }
.step { display: flex; flex-direction: column; gap: 12px; border-left: 3px solid var(--rule); padding-left: 14px; min-width: 0; }
.step .qtext { font-weight: 500; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.card { border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.cardmol { display: flex; align-items: center; gap: 10px; min-height: 96px; justify-content: center; }
.cardmol .let { font-family: var(--font-mono); color: var(--accent); align-self: flex-start; }
.card .fb { font-size: 0.84rem; min-height: 0; }

.theme-btn { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); z-index: 50; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); font-size: 1.15rem; line-height: 1; cursor: pointer; display: grid; place-items: center; box-shadow: 0 1px 6px rgba(0,0,0,.15); }
.theme-btn:hover { border-color: var(--accent); color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
<button type="button" id="themeBtn" class="theme-btn" aria-label="Toggle dark mode" aria-pressed="false" title="Toggle dark mode"></button>
<main class="sheet">
  <header class="top">
    <h1>Midterm 2 Practice Set</h1>
    <div class="meter">
      <div class="bar" role="progressbar" aria-label="Questions answered" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="barWrap"><i id="barFill"></i></div>
      <span class="score" id="score"></span>
      <button type="button" class="reset" id="resetBtn">Start over</button>
    </div>
  </header>
  <div id="root" class="sheet"></div>
</main>
<script>

  function Mol() { this.a = []; this.b = []; this.rings = []; this.chg = []; }

    M.chg.forEach(function (c) { var a = M.a[c.id]; var x = a.x + 0.6 * Math.cos(a.ang * D), y = a.y - 0.6 * Math.sin(a.ang * D); ext(x - 0.3, x + 0.3, y - 0.3, y + 0.3); });

    function ln(x1, y1, x2, y2) { return '<line x1="' + px(x1) + '" y1="' + py(y1) + '" x2="' + px(x2) + '" y2="' + py(y2) + '"/>'; }

  var epox = rg(3, [], { 0: 'O' });
  var cpdCat = rg(5, [0, 2], null, 90, null, { 4: '+' });
  var cpdAn = rg(5, [0, 2], null, 90, null, { 4: '-' });
  var cpdiene = rg(5, [0, 2]);
  var pyrrole = rg(5, [0, 2], { 4: 'NH' });
  var furan = rg(5, [0, 2], { 4: 'O' });

  var ETCL = zig(3, [], ['', '', 'Cl']);
  var MVK = B('', [[0, 30, '', 2], [1, -30, ''], [2, -90, 'O', 2], [2, 30, '']]);
  var MACR = B('', [[0, 30, '', 2], [1, -30, ''], [2, -90, 'O', 2], [2, 30, 'O'], [4, -30, '']]);
